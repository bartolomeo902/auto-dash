const Perf={lat:0,rate:0,ok:0,fail:0,req:0,_c:0,_t0:T(),win:[],SAFE:{st:"20",at:"1",cnt:false},cfg:{st:"20",at:"1",cnt:false},report:null,

  if(!force&&U.perf[key]){await Perf.apply(U.perf[key]);dlog("ELM: configurazione salvata "+JSON.stringify(U.perf[key]));return U.perf[key]}
  const s=Veh.S.speed&&Veh.S.speed.cmd?Veh.S.speed:Object.values(Veh.S).find(x=>x.cmd),e=s&&Veh.ecus[s.ecu];

  const list=(s.dead||s.ok?[s.ecu]:[s.ecu,...((Veh.p.alt&&Veh.p.alt[s.id])||[])]);

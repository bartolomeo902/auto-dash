<!doctype html>
<html lang="it" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Auto Dash</title>
<style>
:root{
  --bg:#06080c;--bg2:#0c1118;--card:#111821;--card2:#18212d;--line:#243040;--fg:#eef3f8;--mut:#8493a6;
  --acc:#4da3ff;--g:#34d058;--o:#f2a516;--r:#ff5d52;--p:#a78bfa;--b:#4da3ff;
  --gbg:#12351f;--obg:#3d2a07;--rbg:#43171a;--pbg:#2b2150;--bbg:#12294a;
  --rad:20px;--pad:14px;color-scheme:dark;
}
html[data-theme="light"]{--bg:#eef2f7;--bg2:#e4e9f0;--card:#ffffff;--card2:#edf1f6;--line:#d3dbe6;--fg:#0b1220;--mut:#5b6a7e;--acc:#0a6cdc;--g:#15803d;--o:#b45309;--r:#c62828;--p:#6d3fd1;--b:#0a6cdc;--gbg:#d9f3e2;--obg:#fde8c3;--rbg:#fcdada;--pbg:#e6defc;--bbg:#d6e7fd;color-scheme:light}
@media (prefers-color-scheme:light){html[data-theme="auto"]{--bg:#eef2f7;--bg2:#e4e9f0;--card:#ffffff;--card2:#edf1f6;--line:#d3dbe6;--fg:#0b1220;--mut:#5b6a7e;--acc:#0a6cdc;--g:#15803d;--o:#b45309;--r:#c62828;--p:#6d3fd1;--b:#0a6cdc;--gbg:#d9f3e2;--obg:#fde8c3;--rbg:#fcdada;--pbg:#e6defc;--bbg:#d6e7fd;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:16px/1.25 ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;font-weight:600}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:var(--r)}
button.ghost{background:transparent;border-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
textarea{min-height:140px;font:12px ui-monospace,Menlo,monospace}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
#dot{width:12px;height:12px;border-radius:50%;background:var(--r);flex:none;box-shadow:0 0 0 0 transparent}
#dot.on{background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--g) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
#veh{font-weight:700;font-size:15px;background:transparent;border:0;padding:4px 6px;min-height:36px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#stat{flex:1;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alerts{display:grid;gap:6px;padding:0 12px}
.alert{background:var(--rbg);color:var(--r);border:1px solid var(--r);border-radius:14px;padding:10px 14px;font-weight:700;margin-top:8px}
.alert.warn{background:var(--obg);color:var(--o);border-color:var(--o)}
main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;padding:12px;display:none;overflow:auto;gap:12px;align-content:start;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));-webkit-overflow-scrolling:touch}
.page.on{display:grid}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:var(--pad);position:relative;min-width:0;transition:opacity .3s}
.card.stale{opacity:.5}
.c2{grid-column:span 2}.cAll{grid-column:1/-1}
@media (min-width:900px){.page{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.val{font-size:34px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.05;letter-spacing:-.01em}
.val small{font-size:14px;font-weight:600;color:var(--mut);margin-left:3px;letter-spacing:0}
.xl{font-size:clamp(64px,22vw,96px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{display:inline-block;border-radius:999px;padding:6px 14px;font-weight:700;font-size:17px;background:var(--card2);color:var(--mut)}
.chip.g{background:var(--gbg);color:var(--g)}.chip.b{background:var(--bbg);color:var(--b)}.chip.o{background:var(--obg);color:var(--o)}.chip.r{background:var(--rbg);color:var(--r)}.chip.p{background:var(--pbg);color:var(--p)}
.chip.dim{opacity:.45}
.bar{height:12px;border-radius:7px;background:var(--card2);overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;border-radius:7px;transition:width .35s ease,background .3s}
.pb{position:relative;height:30px;border-radius:15px;background:var(--card2);overflow:hidden;margin-top:10px}
.pb .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line)}
.pb i{position:absolute;top:0;bottom:0;transition:all .3s}
.pbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.th{display:flex;justify-content:space-around;align-items:flex-end;gap:4px}
.th div{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.th b{display:block;font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px}
.kd{display:inline-block;margin-left:8px;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:800;background:var(--r);color:#fff;visibility:hidden}
.kd.on{visibility:visible;animation:bl .5s infinite alternate}
@keyframes bl{from{opacity:1}to{opacity:.45}}
svg{display:block;margin:0 auto;max-width:100%}
canvas{display:block;max-width:100%}
.spark{width:100%;height:28px;margin-top:6px;opacity:.9}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 2px 12px;font-size:12px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet.hidden{display:none}
.sheet .in{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet .tabs{display:flex;gap:6px;margin:10px 0 6px;overflow:auto}
.sheet .tabs button{flex:none;min-height:36px;padding:4px 12px;font-size:14px}
.sheet .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:8px}
.item.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.item .sub{font-size:12px;color:var(--mut)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--obg);color:var(--o)}
.badge.ok{background:var(--gbg);color:var(--g)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 16px;z-index:60;max-width:92%;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.na{opacity:.55}
.hidden{display:none!important}
pre.dbg{white-space:pre-wrap;font:11px/1.35 ui-monospace,Menlo,monospace;color:var(--mut);margin:6px 0 0;max-height:240px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <span id="dot" role="status" aria-label="stato collegamento"></span>
  <button id="veh" class="ghost" aria-label="scegli auto">Auto</button>
  <span id="stat">non collegato</span>
  <button id="btnConn" class="pri">Collega</button>
  <button id="btnMenu" class="ghost" aria-label="impostazioni" style="padding:8px 10px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<div id="alerts" aria-live="polite"></div>
<main id="pages"></main>
<nav id="tabs"></nav>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
"use strict";
/* =====================================================================
   Auto Dash - dashboard OBD-II per Web Bluetooth (Bluefy)
   Sezioni: util · profili auto · utenti · ELM327 · stato/simulatore ·
            widget · pagine · impostazioni · avvio
   ===================================================================== */

/* ---------- util ---------- */
const $=(q,r=document)=>r.querySelector(q);
const h=(tag,a,...kids)=>{a=a||{};const e=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sg16=(a,b)=>{let v=a*256+b;return v>=32768?v-65536:v};
const fmt=(x,d=0)=>x==null||!isFinite(x)?"–":Number(x).toFixed(d);
const NS="http://www.w3.org/2000/svg";
const svg=(w,hh,inner,cls)=>{const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`0 0 ${w} ${hh}`);s.setAttribute("width",w);s.setAttribute("height",hh);if(cls)s.setAttribute("class",cls);s.innerHTML=inner||"";return s};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const b64=u8=>btoa(String.fromCharCode(...u8));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const T=()=>Date.now();
const hhmm=t=>t?new Date(t).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";
const LOG=[];function dlog(m){LOG.push(new Date().toLocaleTimeString("it-IT")+" "+m);if(LOG.length>80)LOG.shift();const e=$("#dbg");if(e)e.textContent=LOG.join("\n")}
function toast(msg,ms=3200,action){const t=$("#toast");t.replaceChildren(msg,action?h("button",{class:"ghost",onclick:()=>{t.classList.add("hidden");action.fn()}},action.label):"");t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),ms)}
function setStatus(s){$("#stat").textContent=s;dlog(s)}
window.addEventListener("error",e=>setStatus("errore JS: "+e.message));
window.addEventListener("unhandledrejection",e=>setStatus("errore: "+(e.reason&&e.reason.message||e.reason||"rifiutato")));

/* ---------- profili auto ----------
   Ogni profilo = ECU, sensori (comando + formula) e carburanti. Le formule sono
   testo JS su d[] (byte dati dopo servizio+PID) e si possono importare/esportare.
   I sensori che l'auto non supporta vengono disattivati da soli. */
const STD=[ // id, cmd, every, formula, unit, dec, min, max, label
 ["speed","010D",1,"d[0]","km/h",0,0,200,"Velocità"],
 ["rpm","010C",1,"(d[0]*256+d[1])/4","rpm",0,0,6500,"Giri"],
 ["pedal","0149",1,"d[0]*100/255","%",0,0,100,"Pedale"],
 ["thr","0111",1,"d[0]*100/255","%",0,0,100,"Farfalla"],
 ["load","0104",3,"d[0]*100/255","%",0,0,100,"Carico motore"],
 ["maf","0110",2,"(d[0]*256+d[1])/100","g/s",1,0,90,"Portata aria"],
 ["frate","015E",2,"(d[0]*256+d[1])/20","L/h",1,0,25,"Consumo"],
 ["cool","0105",15,"d[0]-40","°C",0,0,120,"Acqua"],
 ["oil","015C",15,"d[0]-40","°C",0,0,140,"Olio"],
 ["iat","010F",20,"d[0]-40","°C",0,-20,80,"Aria aspirata"],
 ["amb","0146",40,"d[0]-40","°C",0,-15,40,"Esterna"],
 ["v12","0142",10,"(d[0]*256+d[1])/1000","V",1,10,16,"12V"],
 ["level","012F",10,"d[0]*100/255","%",0,0,100,"Livello carburante"],
 ["ftype","0151",5,"d[0]","",0,0,32,"Carburante"],
 ["soc","015B",6,"d[0]*100/255","%",0,0,100,"Batteria ibrida"],
 ["rail","0123",10,"(d[0]*256+d[1])/10","bar",0,0,400,"Rail"],
 ["hv","019A",2,"({V:(d[2]*256+d[3])/64,I:sg16(d[4],d[5])/10})","",0,0,0,"Batteria alta tensione"],
];
const std=(ecu)=>STD.map(([id,cmd,every,f,unit,dec,min,max,label])=>({id,ecu,cmd,every,f,unit,dec,min,max,label}));
const FUELS={benzina:{name:"Benzina",price:1.961,codes:[1,9],color:"b"},gpl:{name:"GPL",price:0.85,codes:[5,12],color:"o"},diesel:{name:"Diesel",price:2.21,codes:[4,23],color:"p"}};
const ALERTS_STD=[{id:"cool",hi:110,label:"Acqua troppo calda"},{id:"oil",hi:130,label:"Olio troppo caldo"},{id:"t48",hi:55,label:"Batteria 48V calda"},{id:"soc",lo:12,label:"Batteria ibrida quasi scarica"}];
const ECU29=(a)=>({h:"18DA"+a+"F1",r:"18DAF1"+a});
const ECU11=(n)=>({h:n,r:(parseInt(n,16)+8).toString(16).toUpperCase()});

const PROFILES=[
 {id:"dacia-bigster-hg150",name:"Dacia Bigster Hybrid-G 150 4x4",short:"Bigster",brand:"Dacia",verified:true,hybrid:true,proto:"7",
  notes:"Profilo validato su questa auto: modo guida, marcia, ESC, HDC, freno di stazionamento, batteria 48V, accelerazioni (raw).",
  fuels:["benzina","gpl"],
  ecus:{ECM:ECU29("15"),TCM:ECU29("18"),ESP:ECU29("2D"),DMCM:ECU29("55"),BMS:ECU29("92")},
  sensors:[...std("ECM").filter(s=>s.id!=="soc"),
   {id:"mode",ecu:"ECM",cmd:"220442",every:3,f:"d[0]",label:"Modo guida",enum:{1:"AUTO",3:"ECO",4:"SNOW",5:"LOCK",7:"MUD/SAND"}},
   {id:"gear",ecu:"TCM",cmd:"222271",every:3,f:"d[0]",label:"Marcia",enum:{1:"P",2:"R",3:"N",4:"D",5:"M"}},
   {id:"awd",ecu:"ECM",cmd:"220299",every:5,f:"d[0]",label:"Richiesta 4x4",max:5},
   {id:"esc",ecu:"ESP",cmd:"224B35",every:4,f:"d[0]",label:"ESC"},
   {id:"hdc",ecu:"ESP",cmd:"224B21",every:4,f:"d[0]",label:"Hill Descent"},
   {id:"park",ecu:"ESP",cmd:"224D27",every:4,f:"d[0]",label:"Freno di stazionamento"},
   {id:"alat",ecu:"ESP",cmd:"224B0B",every:1,f:"d[0]-127",label:"Accel. laterale"},
   {id:"alon",ecu:"ESP",cmd:"224B07",every:1,f:"d[0]-127",label:"Accel. longitudinale"},
   {id:"soc",ecu:"BMS",cmd:"229104",every:6,f:"(d[0]*256+d[1])/100",unit:"%",label:"Batteria ibrida 48V",min:0,max:100},
   {id:"v48",ecu:"BMS",cmd:"229017",every:4,f:"(d[0]*256+d[1])/1000",unit:"V",dec:1,label:"48V tensione",min:36,max:56},
   {id:"t48",ecu:"BMS",cmd:"229025",every:20,f:"d[0]-40",unit:"°C",label:"48V temperatura",min:0,max:60}],
  alt:{hv:["DMCM","TCM","BMS"]},
  flags:{escOffValue:170},hvMax:15,
  alerts:[...ALERTS_STD,{id:"v48",lo:40,label:"Tensione 48V bassa"}]},
 {id:"skoda-kamiq",name:"Škoda Kamiq",short:"Kamiq",brand:"Škoda",verified:false,hybrid:false,proto:"6",
  notes:"Solo sensori OBD-II standard (CAN 11 bit, centralina motore 7E0). I DID specifici VAG non sono stati verificati: aggiungili con l'editor profilo.",
  fuels:["benzina"],ecus:{ECM:ECU11("7E0"),TCM:ECU11("7E1")},sensors:std("ECM"),alerts:ALERTS_STD},
 {id:"renault-clio-v",name:"Renault Clio V",short:"Clio",brand:"Renault",verified:false,hybrid:false,proto:"7",
  notes:"Ereditato dalla Bigster (stessa famiglia Renault/Dacia, CAN 29 bit, ECM 18DA15F1). Solo standard OBD-II; da verificare, anche per le versioni E-Tech e Eco-G.",
  fuels:["benzina","gpl"],ecus:{ECM:ECU29("15"),TCM:ECU29("18")},sensors:std("ECM"),alerts:ALERTS_STD},
 {id:"jeep-renegade",name:"Jeep Renegade",short:"Renegade",brand:"Jeep",verified:false,hybrid:false,proto:"6",
  notes:"Standard OBD-II su CAN 11 bit. Per la 4xe (ibrida plug-in) il PID 9A e la carica ibrida potrebbero comparire da soli. Non verificato.",
  fuels:["benzina","diesel"],ecus:{ECM:ECU11("7E0"),TCM:ECU11("7E1")},sensors:std("ECM"),alerts:ALERTS_STD},
 {id:"volvo-xc90",name:"Volvo XC90",short:"XC90",brand:"Volvo",verified:false,hybrid:true,proto:"6",
  notes:"Standard OBD-II su CAN 11 bit. Per la T8 (ibrida plug-in) provo anche carica ibrida e dati batteria (PID 5B e 9A). Non verificato.",
  fuels:["benzina","diesel"],ecus:{ECM:ECU11("7E0"),TCM:ECU11("7E1")},sensors:std("ECM"),alerts:ALERTS_STD},
 {id:"byd-atto2-dmi",name:"BYD Atto 2 DM-i",short:"Atto 2",brand:"BYD",verified:false,hybrid:true,proto:"6",
  notes:"Ibrida plug-in: provo PID 5B (carica) e 9A (tensione e corrente batteria). BYD limita molti dati OBD: il gateway potrebbe non rispondere. Non verificato.",
  fuels:["benzina"],ecus:{ECM:ECU11("7E0")},sensors:std("ECM"),hvMax:60,alerts:ALERTS_STD},
 {id:"generic-obd2",name:"Generico OBD-II",short:"OBD-II",brand:"—",verified:false,hybrid:false,proto:"0",
  notes:"Per qualsiasi auto: rileva i sensori standard supportati.",
  fuels:["benzina"],ecus:{ECM:{h:null,r:"*"}},sensors:std("ECM"),alerts:ALERTS_STD},
];

/* ---------- cifratura e utenti ---------- */
const Auth={
 enc:new TextEncoder(),dec:new TextDecoder(),
 async key(pw,salt){const m=await crypto.subtle.importKey("raw",Auth.enc.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])},
 async seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,Auth.enc.encode(JSON.stringify(obj))));return{iv:b64(iv),ct:b64(ct)}},
 async open(key,box){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(box.iv)},key,unb64(box.ct));return JSON.parse(Auth.dec.decode(pt))},
 users:()=>lsGet("ad.users",[]),
 cur:null,
 async create(name,pw){
  name=name.trim();if(!name)throw new Error("Nome mancante");if(pw.length<4)throw new Error("Password: almeno 4 caratteri");
  const us=Auth.users();if(us.some(u=>u.name.toLowerCase()===name.toLowerCase()))throw new Error("Nome già usato");
  const id="u"+T().toString(36),salt=crypto.getRandomValues(new Uint8Array(16));const key=await Auth.key(pw,salt);
  const data=defaultPrefs();const check=await Auth.seal(key,{ok:1});
  us.push({id,name,salt:b64(salt),check});lsSet("ad.users",us);lsSet("ad.d."+id,await Auth.seal(key,data));
  Auth.cur={id,name,key,guest:false};return data},
 async login(id,pw){
  const u=Auth.users().find(x=>x.id===id);if(!u)throw new Error("Utente non trovato");
  const key=await Auth.key(pw,unb64(u.salt));
  try{await Auth.open(key,u.check)}catch(e){throw new Error("Password errata")}
  const box=lsGet("ad.d."+id,null);const data=box?await Auth.open(key,box):defaultPrefs();

  const sel=h("select",null,...users.map(u=>h("option",{value:u.id},u.name)));const pw=h("input",{type:"password",placeholder:"Password",autocomplete:"current-password"});

  const go=()=>{if(p1.value!==p2.value){err.textContent="Le password non coincidono";return}enter(()=>Auth.create(nm.value,p1.value))};
  body.append(h("label",null,"Nome"),nm,h("label",null,"Password"),p1,p2,err,h("div",{class:"row",style:"margin-top:12px"},h("button",{class:"pri",onclick:go},"Crea e accedi"),users.length?h("button",{onclick:loginBox},"Indietro"):h("button",{onclick:()=>enter(async()=>Auth.guest())},"Continua come ospite")))};

/* ---------- collegamento ---------- */
async function connect(all){
 if(Link.on){Link.stop();return}
 if(!("bluetooth" in navigator)){toast("Web Bluetooth non disponibile: apri la pagina in Bluefy",5000,{label:"Simulazione",fn:demo});return}
 setStatus("tocco ricevuto");
 try{await ELM.connect(all)}catch(e){const m=e===undefined?"scelta annullata o permesso negato":((e&&e.name?e.name+" · ":"")+(e&&e.message||e));setStatus("errore: "+m);toast("Collegamento non riuscito: "+m,6000,all?null:{label:"Mostra tutti",fn:()=>connect(true)})}}
function demo(){if(Link.on)Link.stop();Veh.trip=newTrip();Link.start("sim");setStatus("SIMULAZIONE · "+Veh.p.short)}

 if(P){U.prices=U.prices||{};if(P[9])U.prices.benzina=P[9];if(P[12])U.prices.gpl=P[12]}
 if(I!=null)U.hvInv=I;lsSet("ad.mig",true);savePrefs()}
